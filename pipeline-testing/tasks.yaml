apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: hello
spec:
  params:
    - name: username
      type: string
      default: "Tekton User"
  steps:
    - name: echo
      image: alpine
      script: |
        #!/bin/sh
        echo "Hello, $(params.username)!"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: goodbye
spec:
  steps:
    - name: echo
      image: alpine
      script: |
        #!/bin/sh
        echo "Goodbye from Minikube cluster!"

